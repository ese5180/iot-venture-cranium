#
# Cranium application-core image: settings that do not depend on the board.
# Board specifics (Wi-Fi, TF-M, bootloader, flash) are in boards/.
#
# Based on nRF Connect SDK v3.4.0 samples/net/aws_iot/prj.conf
# (Copyright (c) 2020 Nordic Semiconductor ASA, LicenseRef-Nordic-5-Clause).
#

# Diagnostics
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_REBOOT=y
CONFIG_HW_ID_LIBRARY=y

# Heap and stacks (the board file raises these for Wi-Fi and TLS)
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_CONNECTION_MANAGER=y

# AWS IoT. The endpoint and the thing name are provisioned per device at run time and
# kept in secure storage, so no account-specific value is built into the image.
CONFIG_AWS_IOT=y
CONFIG_AWS_IOT_AUTO_DEVICE_SHADOW_REQUEST=n

# MQTT over TLS only (port 8883). Credentials live under this security tag.
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_HELPER_SEC_TAG=201
CONFIG_MQTT_HELPER_STACK_SIZE=4096
CONFIG_MQTT_HELPER_PAYLOAD_BUFFER_LEN=4096
CONFIG_MQTT_HELPER_RX_TX_BUFFER_SIZE=512
CONFIG_MQTT_KEEPALIVE=120
CONFIG_MQTT_CLEAN_SESSION=y
# No last-will message: the device policy in AWS IoT allows publishing to the device's
# own shadow and jobs topics only, and a connection that announces any other topic is
# refused.
CONFIG_MQTT_HELPER_LAST_WILL=n

# Never compile certificates or keys into the firmware. With this option on, the device
# private key would be part of every OTA image stored in the cloud.
CONFIG_MQTT_HELPER_PROVISION_CERTIFICATES=n

# JSON parsing of job documents
CONFIG_CJSON_LIB=y

# Buttons (update confirmation, factory reset) and the hardware watchdog
CONFIG_INPUT=y
CONFIG_WATCHDOG=y

# Firmware download over HTTPS into the secondary slot. The application drives this
# itself instead of using the aws_fota library, which starts downloading without
# asking, reports success before the new image has run, and checks neither the
# version nor a digest.
CONFIG_AWS_FOTA=n
CONFIG_FOTA_DOWNLOAD=y
CONFIG_FOTA_DOWNLOAD_PROGRESS_EVT=y
CONFIG_FOTA_CLIENT_AUTOSCHEDULE_UPDATE=n
CONFIG_FOTA_DOWNLOAD_BUF_SZ=4096
CONFIG_DFU_TARGET=y
CONFIG_DFU_TARGET_MCUBOOT=y
CONFIG_DOWNLOADER=y
CONFIG_DOWNLOADER_STACK_SIZE=4096
# Presigned download URLs are long.
CONFIG_DOWNLOADER_MAX_FILENAME_SIZE=2048
# Never follow a redirect: it could lead to another host or to plain HTTP.
CONFIG_DOWNLOADER_MAX_REDIRECTS=0

# ---------------------------------------------------------------------------------
# Development and provisioning build: a serial console with the `prov` commands.
# A release build turns all of this off.
# ---------------------------------------------------------------------------------
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=6144
CONFIG_SHELL_CMD_BUFF_SIZE=384
# Do not keep typed commands (which include the Wi-Fi passphrase) in memory.
CONFIG_SHELL_HISTORY=n
# Only the provisioning commands: no generic memory, device or kernel commands.
CONFIG_DEVMEM_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_KERNEL_SHELL=n
CONFIG_DATE_SHELL=n
# The generic Wi-Fi credential commands can print a stored passphrase.
CONFIG_WIFI_CREDENTIALS_SHELL=n
CONFIG_APP_VERSION_SHELL=n
CONFIG_APP_PROVISIONING_SHELL=y

# On-device key generation and certificate signing request
CONFIG_MBEDTLS_X509_CREATE_C=y
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
