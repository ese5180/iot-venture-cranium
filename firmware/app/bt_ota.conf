#
# What the application core needs for firmware updates over Bluetooth LE. Applied by
# sysbuild.cmake when SB_CONFIG_APP_BT_OTA is on. See bt_ota_sysbuild.conf.
#

CONFIG_APP_BT_OTA=y

# These sizes are not measured on a board yet. See "Before relying on it" in firmware/README.md.
# The Bluetooth stack asks for 4096 bytes more of heap, which CONFIG_HEAP_MEM_POOL_IGNORE_MIN drops
# in this project, and the IPC with the network core takes its queues from there at the first
# press. This keeps what Wi-Fi and TLS have free as it is without Bluetooth.
CONFIG_HEAP_MEM_POOL_SIZE=44240

# One peripheral link and nothing else: no scanning, no central role, no bonds in flash.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_DEVICE_NAME="Cranium"
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GATT_SERVICE_CHANGED=n

# On the air only as a resolvable private address, and a new one every 15 minutes. Nothing ever
# gets the key to resolve it, because nothing bonds.
CONFIG_BT_PRIVACY=y

# LE Secure Connections with MITM protection and a full-length key, or no pairing at all.
# A pairing lasts as long as the link: nothing is kept, so no phone can come back later.
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_BONDABLE=n
CONFIG_BT_SETTINGS=n

# Pairing runs on this thread. The default is for applications that do little, and nothing has
# measured how much this takes on a board yet.
CONFIG_BT_RX_STACK_SIZE=2048

# Room for one SMP packet in one ATT write, as in Zephyr's smp_svr sample.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502

# MCUmgr, with the image group only: there is no way to reset the board, read a file or run
# a shell from a phone. The permission is the first lock on the characteristic, and the
# hooks in src/bt_ota.c are the second.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=4
# As in smp_svr's bt.conf: the upload runs on it, down to the flash driver, and so do the hooks.
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_MUTEX=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y

# Never a permanent swap from a command, which would have no revert.
CONFIG_MCUMGR_GRP_IMG_ALLOW_CONFIRM_NON_ACTIVE_SLOT=n
CONFIG_MCUMGR_GRP_IMG_ALLOW_ERASE_PENDING=n
