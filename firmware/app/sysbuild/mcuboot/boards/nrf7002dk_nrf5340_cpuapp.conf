#
# MCUboot on the nRF7002 DK: drive the MX25R64 external flash that holds the secondary slot.
#
# Based on nRF Connect SDK v3.4.0
# samples/net/aws_iot/sysbuild/mcuboot/boards/nrf7002dk_nrf5340_cpuapp.conf
# (Copyright (c) 2023 Nordic Semiconductor ASA, LicenseRef-Nordic-5-Clause).
#

CONFIG_FLASH=y
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=0

# External flash on SPI (the QSPI peripheral is used by the nRF7002)
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

CONFIG_BOOT_ERASE_PROGRESSIVELY=y
CONFIG_SOC_FLASH_NRF_EMULATE_ONE_BYTE_WRITE_ACCESS=y
