#
# MCUboot configuration for the Cranium firmware. This directory replaces MCUboot's own
# configuration, so everything the bootloader needs is listed here or in boards/.
# The signature type, key file and swap mode come from sysbuild.conf.
#
# Based on nRF Connect SDK v3.4.0 samples/net/aws_iot/sysbuild/mcuboot/prj.conf
# (Copyright (c) 2024 Nordic Semiconductor ASA, LicenseRef-Nordic-5-Clause).
#

CONFIG_PM=n

CONFIG_MAIN_STACK_SIZE=10240

# Swap with revert, images in the clear. (Image encryption is configured separately.)
CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_BOOT_BOOTSTRAP=n
CONFIG_BOOT_ENCRYPT_IMAGE=n
CONFIG_BOOT_SWAP_SAVE_ENCTLV=n

# Check the signature of the primary slot on every boot, not only after an update,
# so that an image modified in flash is never started.
CONFIG_BOOT_VALIDATE_SLOT0=y

# Anti-rollback: never install an image older than the one that is running. The build
# number counts, so 1.2.3+4 cannot be replaced by 1.2.3+3. Reverting a failed test
# image is still allowed.
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
CONFIG_BOOT_VERSION_CMP_USE_BUILD_NUMBER=y

# Write-protect the bootloader's own flash region before starting the application.
CONFIG_FLASH=y
CONFIG_FPROTECT=y

# Keep the bootloader small: no radios, no I2C.
# CONFIG_BT is not set
# CONFIG_I2C is not set
CONFIG_WIFI_NRF70=n

# Short boot log on the console: which image was validated and whether a swap ran.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_CBPRINTF_NANO=y
