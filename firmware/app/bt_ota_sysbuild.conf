#
# The one switch for firmware updates over Bluetooth LE. Off in a normal build:
#
#   west build -b nrf7002dk/nrf5340/cpuapp/ns --sysbuild firmware/app -- -DSB_EXTRA_CONF_FILE=bt_ota_sysbuild.conf
#
# See "Firmware update over Bluetooth" in firmware/README.md. It takes a debug-port flash of
# the network core, and only then does an image built with it work.
#

SB_CONFIG_APP_BT_OTA=y

# The network core runs the Bluetooth controller instead of the blinky.
SB_CONFIG_NETCORE_HCI_IPC=y
