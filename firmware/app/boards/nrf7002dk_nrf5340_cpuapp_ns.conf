#
# nRF7002 DK, application core, non-secure target (TF-M in the secure domain).
#
# Based on nRF Connect SDK v3.4.0
# samples/net/aws_iot/boards/nrf7002dk_nrf5340_cpuapp_ns.conf
# (Copyright (c) 2023 Nordic Semiconductor ASA, LicenseRef-Nordic-5-Clause).
#

# General
CONFIG_POSIX_TIMERS=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=40144
CONFIG_NRF_WIFI_CTRL_HEAP_SIZE=20000
CONFIG_NRF_WIFI_DATA_HEAP_SIZE=59856
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_HW_STACK_PROTECTION=y
# Device identity: the SoC's factory-programmed 64-bit identifier
CONFIG_HWINFO=y
CONFIG_HW_ID_LIBRARY_SOURCE_DEVICE_ID=y
CONFIG_MAIN_STACK_SIZE=6144

# Optimize the Wi-Fi stack to save memory
CONFIG_NRF70_RX_NUM_BUFS=16
CONFIG_NRF70_MAX_TX_AGGREGATION=4

# Wi-Fi station. Credentials are stored through PSA in TF-M's internal trusted storage.
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# WEP and WPA (TKIP) are broken. Remove them, and the MD5/RC4 code they need, from
# the supplicant so that they cannot be negotiated at all.
CONFIG_WIFI_NM_WPA_SUPPLICANT_WEP=n
CONFIG_WIFI_NM_WPA_SUPPLICANT_LEGACY_CRYPTO=n

# Sockets
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS_OFFLOAD=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONTEXT_SNDTIMEO=y
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_NET_RX_STACK_SIZE=2048

# DNS
CONFIG_DNS_RESOLVER=y
CONFIG_NET_SOCKETS_DNS_TIMEOUT=30000

# TLS (Mbed TLS on PSA crypto; the crypto itself runs inside TF-M)
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=81920
CONFIG_MBEDTLS_DECLARE_PRIVATE_IDENTIFIERS=y
CONFIG_MBEDTLS_MD_C=y
CONFIG_MBEDTLS_HMAC_DRBG_C=y
CONFIG_MBEDTLS_SHA256_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_RSA_C=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_RSA_KEY_PAIR_GENERATE=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
# 512-byte MPI limit so that 4096-bit RSA certificate chains can be verified.
CONFIG_MBEDTLS_MPI_MAX_SIZE=512
# ECDHE key agreement and ECDSA are needed for the TLS handshake
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_ECDSA=y

CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
# One TLS session for MQTT and one for the HTTPS firmware download, at the same time: the
# connection to AWS IoT stays up during a download, so that a cancellation still arrives.
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=2
# Each session takes its two record buffers from the heap above. What comes in must fit
# 16 KB, because neither S3 nor AWS IoT can be asked to send shorter records. What goes
# out is small: a request for the image, MQTT messages and one client certificate. With
# 16 KB in both directions the second session ran out of heap in the middle of the
# handshake, which Mbed TLS reports as -141 from mbedtls_x509_crt_parse_der().
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096

# The device certificate, its private key and the root CA are kept in TF-M Protected
# Storage (encrypted with a key derived from the hardware unique key), not in the image.
CONFIG_TLS_CREDENTIALS_BACKEND_PROTECTED_STORAGE=y

# Connection manager: the application decides when to connect.
CONFIG_L2_WIFI_CONNECTIVITY=y
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_CONNECT=n
CONFIG_L2_WIFI_CONNECTIVITY_AUTO_DOWN=n

# External flash (MX25R64 on SPI) holds the secondary image slot. Use 4 KiB erase
# blocks in the application as well as in the bootloader so that erasing never
# reaches past the end of the slot.
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# Bootloader support in the application
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_USE_ALL_AVAILABLE_RAM=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
# MCUboot is built with downgrade prevention.
CONFIG_MCUBOOT_BOOTLOADER_NO_DOWNGRADE=y

# TF-M
CONFIG_TFM_PROFILE_TYPE_SMALL=y

# Network core: release it from reset. The RTC synchronisation service between the
# cores is not needed because the two images do not talk to each other.
CONFIG_SOC_NRF53_CPUNET_ENABLE=y
CONFIG_NRF53_SYNC_RTC=n

# Link-time optimisation is needed to fit the non-secure image
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

CONFIG_CBPRINTF_FP_SUPPORT=y
